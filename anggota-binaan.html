
<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102a22">
  <meta name="description" content="Daftar anggota binaan Mentor TARBIYAH">

  <title>Anggota Binaan — TARBIYAH</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/module.css">
  <link rel="stylesheet" href="./css/module-shell.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, sans-serif;
    }

    .mentor-page {
      width: min(1100px, 100%);
      margin: auto;
      padding: 24px 17px 90px;
    }

    .mentor-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 24px;
    }

    .mentor-header h1 {
      margin: 0 0 8px;
      font: 800 clamp(1.45rem, 4vw, 2rem) Poppins, sans-serif;
    }

    .mentor-header p {
      margin: 0;
      color: var(--text-secondary, #a7c8ba);
      font-size: .84rem;
      line-height: 1.7;
    }

    .mentor-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--border-color, rgba(255,255,255,.1));
      border-radius: 11px;
      color: var(--text-primary, #ecfdf5);
      text-decoration: none;
      font-size: .78rem;
      font-weight: 700;
    }

    .mentor-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
      margin-bottom: 22px;
    }

    .mentor-stat {
      padding: 18px;
      border: 1px solid var(--border-color, rgba(255,255,255,.1));
      border-radius: 15px;
      background: var(--bg-card, #102a22);
    }

    .mentor-stat small {
      display: block;
      color: var(--text-secondary, #a7c8ba);
      font-size: .75rem;
      margin-bottom: 8px;
    }

    .mentor-stat strong {
      font: 800 1.7rem Poppins, sans-serif;
      color: #34d399;
    }

    .mentor-panel {
      padding: 18px;
      border: 1px solid var(--border-color, rgba(255,255,255,.1));
      border-radius: 16px;
      background: var(--bg-card, #102a22);
    }

    .mentor-panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 17px;
    }

    .mentor-panel-heading h2 {
      margin: 0;
      font: 700 1rem Poppins, sans-serif;
    }

    .mentor-search {
      width: 100%;
      min-height: 43px;
      padding: 11px 13px;
      border: 1px solid var(--border-color, rgba(255,255,255,.12));
      border-radius: 10px;
      outline: none;
      color: var(--text-primary, #ecfdf5);
      background: var(--bg-secondary, #102a22);
      font: inherit;
      font-size: .82rem;
      margin-bottom: 17px;
    }

    .mentor-search:focus {
      border-color: #10b981;
    }

    .mentor-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .mentor-member-card {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--border-color, rgba(255,255,255,.1));
      border-radius: 14px;
      background: var(--bg-secondary, rgba(255,255,255,.025));
    }

    .mentor-member-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .mentor-avatar {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(16,185,129,.15);
      color: #34d399;
      font: 800 1rem Poppins, sans-serif;
    }

    .mentor-member-name {
      min-width: 0;
    }

    .mentor-member-name strong {
      display: block;
      overflow-wrap: anywhere;
      font-size: .88rem;
    }

    .mentor-member-name small {
      display: block;
      margin-top: 5px;
      color: var(--text-secondary, #a7c8ba);
      font-size: .7rem;
    }

    .mentor-member-details {
      display: grid;
      gap: 8px;
      font-size: .75rem;
    }

    .mentor-detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .mentor-detail-row span:first-child {
      color: var(--text-secondary, #a7c8ba);
    }

    .mentor-detail-row span:last-child {
      text-align: right;
      overflow-wrap: anywhere;
    }

    .mentor-status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 30px;
      background: rgba(16,185,129,.12);
      color: #34d399;
      font-size: .66rem;
      font-weight: 800;
    }

    .mentor-status.inactive {
      background: rgba(248,113,113,.1);
      color: #f87171;
    }

    .mentor-message {
      padding: 14px;
      border-radius: 11px;
      margin-bottom: 15px;
      font-size: .8rem;
      line-height: 1.6;
      display: none;
      overflow-wrap: anywhere;
    }

    .mentor-message.show { display: block; }

    .mentor-message.error {
      background: rgba(248,113,113,.1);
      color: #f87171;
    }

    .mentor-message.success {
      background: rgba(16,185,129,.1);
      color: #34d399;
    }

    .mentor-empty {
      grid-column: 1 / -1;
      padding: 35px 15px;
      border: 1px dashed var(--border-color, rgba(255,255,255,.15));
      border-radius: 13px;
      text-align: center;
      color: var(--text-secondary, #a7c8ba);
      font-size: .82rem;
      line-height: 1.7;
    }

    .mentor-empty strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1rem;
      color: var(--text-primary, #ecfdf5);
    }

    .mentor-refresh {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: #047857;
      color: white;
      font: 700 .75rem Inter, sans-serif;
      cursor: pointer;
    }

    .mentor-refresh:disabled {
      opacity: .6;
      cursor: wait;
    }

    .mentor-footer {
      margin-top: 18px;
      color: var(--text-secondary, #a7c8ba);
      font-size: .7rem;
      line-height: 1.6;
      text-align: center;
    }

    @media(max-width: 650px) {
      .mentor-page {
        padding: 19px 13px 85px;
      }

      .mentor-list {
        grid-template-columns: 1fr;
      }

      .mentor-panel {
        padding: 14px;
      }
    }

    @media(max-width: 350px) {
      .mentor-summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body class="auth-pending">

  <main class="mentor-page" data-module="anggota-binaan">

    <header class="mentor-header">
      <div>
        <h1>Anggota Binaan</h1>
        <p>
          Daftar anggota yang berada dalam pendampingan
          Mentor TARBIYAH.
        </p>
      </div>

  <a
  id="btnBackDashboard"
  href="./dashboard.html"
  onclick="window.location.assign(this.href); return false;"
  style="
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 18px;
    border: 0;
    border-radius: 12px;
    background: #087f5b;
    color: #ffffff;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    position: relative;
    z-index: 9999;
    pointer-events: auto;
  "
>
  ← Kembali ke Dashboard
</a>
      
    </header>

    <section class="mentor-summary">
      <article class="mentor-stat">
        <small>Total Anggota Binaan Aktif</small>
        <strong id="totalMentees">—</strong>
      </article>

      <article class="mentor-stat">
        <small>Penugasan Aktif</small>
        <strong id="activeAssignments">—</strong>
      </article>
    </section>

    <section class="mentor-panel">

      <div class="mentor-panel-heading">
        <h2>Daftar Anggota Binaan</h2>

        <button
          type="button"
          class="mentor-refresh"
          id="refreshMentees"
        >
          ↻ Perbarui
        </button>
      </div>

      <div
        class="mentor-message"
        id="mentorMessage"
        role="status"
      ></div>

      <input
        type="search"
        class="mentor-search"
        id="menteeSearch"
        placeholder="Cari nama, nomor anggota, atau kota..."
        aria-label="Cari anggota binaan"
      >

      <div class="mentor-list" id="menteeList">
        <div class="mentor-empty">
          Memuat data anggota binaan...
        </div>
      </div>

    </section>

    <p class="mentor-footer">
      Data ditampilkan berdasarkan penugasan aktif dan
      hak akses akun yang sedang login.
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/auth-guard.js"></script>
  <script src="./js/theme-manager.js"></script>
  <script src="./js/module.js"></script>
  <script src="./js/module-shell.js"></script>
  <script src="./js/pwa.js"></script>
  <script src="./js/anggota-binaan.js"></script>

</body>
</html>
