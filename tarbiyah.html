<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102a22"><title>Dashboard — TARBIYAH</title>
  <link rel="icon" href="./assets/icons/tarbiyah-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/variables.css"><link rel="stylesheet" href="./css/global.css"><link rel="stylesheet" href="./css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- ERUDA DEBUG CONSOLE - SEMENTARA UNTUK AUDIT -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
  eruda.init();
  console.log("TARBIYAH DEBUG CONSOLE AKTIF");
</script>
  <script defer src="./js/config.js"></script><script defer src="./js/supabase-client.js"></script><script defer src="./js/auth.js"></script>
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:22px;background:var(--bg,#102a22);color:var(--text,#f4f5ed);font-family:Inter,system-ui,sans-serif}
    .placeholder{width:min(100%,620px);padding:clamp(25px,5vw,48px);border:1px solid rgba(210,220,210,.18);border-radius:24px;background:rgba(30,60,45,.35);text-align:center}
    .placeholder img{width:76px;height:76px}.placeholder h1{font-family:Poppins,sans-serif}.placeholder p{line-height:1.8;opacity:.8}.pill{display:inline-block;padding:7px 12px;border-radius:99px;background:rgba(54,145,102,.2);color:#8bd4ac;font-size:12px}
    button{margin:8px;padding:12px 20px;border:0;border-radius:10px;background:#2e8b68;color:white;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="placeholder">
    <img src="./assets/icons/tarbiyah-mark.svg" alt="Logo TARBIYAH">
    <p class="pill">TAHAP 2 — AUTENTIKASI</p>
    <h1>Alhamdulillah, Anda berhasil masuk.</h1>
    <p id="welcomeText">Memeriksa sesi akun...</p>
    <p>Ini adalah halaman sementara untuk menguji alur login. Dashboard lengkap akan dibangun pada Tahap 3.</p>
    <button id="logoutButton" type="button">Keluar dari akun</button>
  </main>
  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const welcome = document.getElementById("welcomeText");
      try {
        const result = await window.TARBIYAH_AUTH.getSession();
        if (!result.configured || !result.session) { location.replace("./login-register.html"); return; }
        const user = result.session.user;
        welcome.textContent = "Akun aktif: " + (user.user_metadata?.full_name || user.email || "Anggota TARBIYAH");
      } catch (e) { welcome.textContent = "Sesi belum dapat diperiksa. Silakan masuk kembali."; }
      document.getElementById("logoutButton").addEventListener("click", async () => {
        const button = document.getElementById("logoutButton"); button.disabled = true; button.textContent = "Keluar...";
        try { await window.TARBIYAH_AUTH.signOut(); location.replace("./login-register.html"); }
        catch (e) { button.disabled = false; button.textContent = "Keluar dari akun"; alert(e.message || "Gagal keluar."); }
      });
    });
  </script>
</body>
</html>
