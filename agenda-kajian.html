<!DOCTYPE html>
<html lang="id" data-theme="dark" data-module="agenda-kajian">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102a22">
  <meta name="description" content="Kelola agenda kajian TARBIYAH — Pembelajaran Muslim.">
  <title>Kelola Kajian — TARBIYAH</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/brand-logo.css">
  <link rel="stylesheet" href="./css/module-shell.css">

  <style>
    /* =========================================
       TEMA VARIABEL AGENDA
    ========================================= */
    :root {
      --agenda-primary: var(--color-primary, #10b981);
      --agenda-primary-dark: #059669;
      --agenda-primary-soft: rgba(16, 185, 129, .13);
      --agenda-bg: var(--bg-primary, #102a22);
      --agenda-panel: var(--bg-secondary, #17382e);
      --agenda-panel-soft: var(--bg-tertiary, #1c4235);
      --agenda-text: var(--text-primary, #ecfdf5);
      --agenda-muted: var(--text-secondary, #a7c4b7);
      --agenda-border: var(--border-color, rgba(167, 243, 208, .14));
      --agenda-danger: #ef4444;
      --agenda-warning: #f59e0b;
    }

    body {
      margin: 0;
      background: var(--agenda-bg);
      color: var(--agenda-text);
      font-family: "Inter", sans-serif;
    }

    /* =========================================
       HEADER (TOGGLE TEMA & NOTIFIKASI)
    ========================================== */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      height: 70px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left, .header-brand { display: flex; align-items: center; gap: 14px; }
    .brand-logo-wrap { width: 40px; height: 40px; display: flex; overflow: hidden; border-radius: 10px; }
    .brand-logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .header-brand-text h1 { margin: 0; font-size: 1.15rem; font-weight: 800; color: var(--color-primary); line-height: 1.1; }
    .header-brand-text span { display: block; font-size: .75rem; color: var(--text-secondary); margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    
    .icon-button {
      display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border: 1px solid var(--border-color);
      border-radius: 12px; background: var(--bg-secondary);
      color: var(--text-primary); cursor: pointer; font-size: 1.25rem;
      text-decoration: none; transition: all .2s ease;
    }
    .icon-button:hover { border-color: var(--color-primary); background: var(--bg-tertiary); }

    /* =========================================
       SIDEBAR HAMBURGER
    ========================================== */
    .agenda-sidebar-overlay {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(0, 0, 0, .58);
      opacity: 0; visibility: hidden; transition: .25s ease;
    }
    .agenda-sidebar-overlay.is-visible { opacity: 1; visibility: visible; }

    .agenda-sidebar {
      position: fixed; z-index: 90; top: 0; bottom: 0; left: 0;
      width: min(290px, 84vw); padding: 20px 15px;
      background: var(--bg-secondary); border-right: 1px solid var(--border-color);
      box-shadow: 5px 0 25px rgba(0,0,0,.2);
      transform: translateX(-105%); transition: transform .28s ease;
      overflow-y: auto; display: flex; flex-direction: column;
    }
    .agenda-sidebar.is-open { transform: translateX(0); }

    .sidebar-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 5px 20px; border-bottom: 1px solid var(--border-color);
    }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }

    .sidebar-nav { display: grid; gap: 7px; margin-top: 20px; flex: 1; }
    .sidebar-nav a {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 13px; border-radius: 12px;
      color: var(--text-secondary); text-decoration: none;
      font-size: 13px; font-weight: 600; transition: .2s ease;
    }
    .sidebar-nav a:hover, .sidebar-nav a.active {
      color: var(--color-primary); background: rgba(54,181,138,.1);
    }

    /* Tombol Logout di Bawah Sidebar */
    .sidebar-logout-area {
      margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between;
    }
    .profile-info { display: flex; align-items: center; gap: 10px; }
    .profile-avatar {
      width: 40px; height: 40px; border-radius: 50%; overflow: hidden;
      border: 2px solid var(--border-color); display: flex;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .logout-btn {
      background: transparent; border: none; color: #ef4444;
      font-weight: 700; font-size: 12px; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
    }

    /* =========================================
       MAIN CONTENT
    ========================================== */
    .agenda-main { width: min(1120px, 100%); margin: 0 auto; padding: 24px 18px 40px; }
    
    .page-header-nav { margin-bottom: 24px; }

    .connection-card, .role-information, .agenda-panel {
      border: 1px solid var(--agenda-border); border-radius: 18px;
      background: var(--agenda-panel); margin-bottom: 20px; padding: 20px;
    }

    /* Form & Layout */
    .agenda-form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-control { width: 100%; min-height: 44px; padding: 11px; border: 1px solid var(--border-color); border-radius: 11px; background: var(--bg-tertiary); color: var(--text-primary); }
    
    /* Tabs */
    .agenda-tabs { display: flex; gap: 7px; margin-bottom: 15px; }
    .agenda-tab { padding: 9px 13px; border: 1px solid var(--border-color); border-radius: 10px; background: transparent; color: var(--text-secondary); cursor: pointer; }
    .agenda-tab.is-active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

    /* Card Agenda */
    .agenda-card { padding: 16px; border: 1px solid var(--border-color); border-radius: 15px; background: var(--bg-tertiary); margin-bottom: 13px; }
    .agenda-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 11px; }
    
    /* PERBAIKAN BORDER DITERBITKAN (Lebih kecil & presisi) */
    .agenda-status {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 3px 8px; /* Lebih kecil */
      border-radius: 6px; /* Lebih kotak, bukan pil */
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-active { background: rgba(16, 185, 129, .15); color: #34d399; border: 1px solid rgba(16,185,129,.3); }
    .status-archived { background: rgba(245, 158, 11, .15); color: #fbbf24; border: 1px solid rgba(245,158,11,.3); }

    .agenda-map-link { display: inline-block; margin-top: 10px; font-weight: 700; color: var(--color-primary); text-decoration: none; font-size: 12px; }
    
    @media (max-width: 650px) {
      .agenda-form { grid-template-columns: 1fr; }
      .header-brand-text h1 { font-size: 1rem; }
    }
  </style>
</head>

<body class="auth-pending">

  <div class="app-shell">

    <!-- HEADER -->
    <header class="app-header">
      <div class="header-left">
        <button class="icon-button" id="agendaMenuButton" aria-label="Buka menu">☰</button>
        <div class="header-brand">
          <div class="brand-logo-wrap">
            <img src="./assets/icons/icon-192.png" class="brand-logo" alt="Logo">
          </div>
          <div class="header-brand-text">
            <h1>TARBIYAH TAUHID</h1>
            <span>Kelola Kajian</span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <!-- TOMBOL TEMA (BUKAN BACK) -->
        <button type="button" id="btnTheme" class="icon-button" aria-label="Ubah tema">☀</button>
        <a href="./notifikasi.html" class="icon-button" aria-label="Notifikasi">♧</a>
      </div>
    </header>

    <!-- SIDEBAR OVERLAY -->
    <div class="agenda-sidebar-overlay" id="agendaSidebarOverlay"></div>

    <!-- SIDEBAR HAMBURGER -->
    <aside class="agenda-sidebar" id="agendaSidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand">
          <span>TARBIYAH TAUHID</span>
        </div>
        <button class="icon-button" id="agendaMenuClose" style="border:none; background:transparent;">×</button>
      </div>

      <nav class="sidebar-nav">
        <a href="./dashboard.html">⌂ Dashboard</a>
        <a href="./agenda-kajian.html" class="active">📚 Agenda Kajian</a>
        <a href="./notifikasi.html">♧ Notifikasi</a>
        <a href="./galeri-foto-video.html">▧ Galeri</a>
        <a href="./profil-anggota.html">◎ Profil Saya</a>
      </nav>

      <!-- BAGIAN BAWAH SIDEBAR: Profil & Logout -->
      <div class="sidebar-logout-area">
        <div class="profile-info">
          <div class="profile-avatar">
            <img src="./assets/icons/icon-192.png" alt="Foto Profil">
          </div>
          <div style="font-size:12px; font-weight:700;">Anggota</div>
        </div>
        <button type="button" class="logout-btn" onclick="window.TARBIYAH_AUTH?.signOut().then(()=>window.location.href='./login-register.html')">
          ↪ Keluar
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="agenda-main">
      
      <!-- TOMBOL BACK KEMBALI (Hanya 1 di Konten Utama) -->
      <div class="page-header-nav">
        <a href="./dashboard.html" class="tarbiyah-page-nav__button" aria-label="Kembali ke Dashboard">
          <span class="tarbiyah-page-nav__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </span>
          <span class="tarbiyah-page-nav__label">Kembali ke Dashboard</span>
        </a>
      </div>

      <section class="role-information">
        <strong>Informasi hak akses</strong>
        <p id="userRole">Memeriksa hak akses akun...</p>
      </section>

      <!-- FORM PANEL -->
      <section class="agenda-panel" id="agendaFormPanel" hidden>
        <h2 id="formHeading" style="margin-top:0;">Tambah Agenda Kajian</h2>
        <form id="agendaForm" class="agenda-form" novalidate>
          <input type="hidden" id="agendaId" name="agendaId">
          
          <div class="form-field full">
            <label for="title">Judul Kajian <span style="color:red">*</span></label>
            <input class="form-control" type="text" id="title" required>
          </div>
          <div class="form-field full">
            <label for="description">Deskripsi</label>
            <textarea class="form-control" id="description"></textarea>
          </div>
          <div class="form-field full">
            <label for="speakerName">Pemateri</label>
            <input class="form-control" type="text" id="speakerName">
          </div>
          <div class="form-field">
            <label for="startsAt">Waktu Mulai <span style="color:red">*</span></label>
            <input class="form-control" type="datetime-local" id="startsAt" required>
          </div>
          <div class="form-field">
            <label for="endsAt">Waktu Selesai <span style="color:red">*</span></label>
            <input class="form-control" type="datetime-local" id="endsAt" required>
          </div>
          <div class="form-field full">
            <label for="locationName">Nama Tempat</label>
            <input class="form-control" type="text" id="locationName">
          </div>
          <div class="form-field full">
            <label for="locationAddress">Alamat atau Tautan Google Maps</label>
            <textarea class="form-control" id="locationAddress" placeholder="Contoh: https://maps.app.goo.gl/xxx atau -6.123, 106.456"></textarea>
          </div>
          
          <div style="grid-column: 1 / -1; display:flex; gap:9px; margin-top:10px;">
            <button class="btn btn-primary" type="submit" id="saveButton" style="background:#10b981;color:white;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;">Simpan</button>
            <button class="btn btn-secondary" type="button" id="cancelEditButton" hidden style="padding:10px 16px;border-radius:8px;cursor:pointer;">Batal</button>
          </div>
          <div id="agendaNotice" hidden></div>
        </form>
      </section>

      <!-- LIST PANEL -->
      <section class="agenda-panel" id="agendaListPanel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h2 style="margin:0;">Daftar Agenda</h2>
          <span class="agenda-count" id="agendaCount" style="background:rgba(16,185,129,.13); color:#10b981; padding:3px 8px; border-radius:20px; font-weight:800; font-size:11px;">0</span>
        </div>

        <div class="agenda-tabs" role="tablist">
          <button class="agenda-tab is-active" type="button" data-agenda-view="published">Semua Kajian</button>
          <button class="agenda-tab" type="button" data-agenda-view="archived">Arsip Historis</button>
          <button class="agenda-tab" type="button" data-agenda-view="latest">Kajian Terbaru</button>
        </div>

        <div class="agenda-list" id="agendaList">
          <div class="agenda-loading">Memuat data agenda kajian...</div>
        </div>

        <div style="margin-top:16px;">
          <button class="btn btn-secondary" type="button" id="refreshButton" style="padding:10px 16px;border-radius:8px;cursor:pointer;">↻ Muat Ulang</button>
        </div>
      </section>

    </main>
  </div>

  <!-- SUPABASE & APPLICATION SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/auth-guard.js"></script>
  <script src="./js/tarbiyah-theme.js"></script>
  <script src="./js/agenda-kajian.js"></script>
  <script src="./js/pwa.js"></script>

  <!-- LOGIKA HAMBURGER SIDEBAR -->
  <script>
    (() => {
      const btnOpen = document.getElementById("agendaMenuButton");
      const btnClose = document.getElementById("agendaMenuClose");
      const sidebar = document.getElementById("agendaSidebar");
      const overlay = document.getElementById("agendaSidebarOverlay");

      function toggleMenu(open) {
        sidebar.classList.toggle("is-open", open);
        overlay.classList.toggle("is-visible", open);
        if(open) document.body.style.overflow = "hidden";
        else document.body.style.overflow = "";
      }

      if (btnOpen) btnOpen.addEventListener("click", () => toggleMenu(true));
      if (btnClose) btnClose.addEventListener("click", () => toggleMenu(false));
      if (overlay) overlay.addEventListener("click", () => toggleMenu(false));
    })();
  </script>
</body>
</html>
