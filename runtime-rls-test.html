
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TARBIYAH - Runtime RLS Test</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f1f5f2;
      color: #18352a;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px #0000000d;
    }

    h2 { margin-top: 0; }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #087b53;
      color: white;
      font-weight: bold;
      font-size: 15px;
      margin-top: 10px;
    }

    pre {
      background: #10251d;
      color: #b8f5d5;
      padding: 14px;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      line-height: 1.6;
    }

    .warning {
      color: #986000;
      background: #fff6df;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
    }
  </style>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Konfigurasi TARBIYAH -->
  <script src="js/config.js"></script>

  <!-- Supabase Client TARBIYAH -->
  <script src="js/supabase-client.js"></script>
</head>

<body>
<div class="container">

  <div class="card">
    <h2>🛡️ TARBIYAH Runtime RLS Test</h2>
    <p>Pengujian keamanan database melalui sesi login pengguna.</p>

    <div class="warning">
      Pengujian ini hanya membaca data. Tidak mengubah profil,
      role, keanggotaan, atau data pengguna.
    </div>

    <button onclick="runRLSTest()">
      MULAI RUNTIME RLS TEST
    </button>
  </div>

  <button onclick="runWriteSecurityTest()"
  style="background:#9a5b16">
  MULAI WRITE SECURITY TEST
  </button>

  <button onclick="runRPCTest()"
  style="background:#8b3c85">
  MULAI RPC AUTHORIZATION TEST
  </button>

  <button onclick="runApproveMemberTest()"
  style="background:#087f5b">
  UJI PERSETUJUAN ANGGOTA
  </button>
  
  <div class="card">
    <h3>Hasil Pengujian</h3>
    <pre id="output">Menunggu pengujian...</pre>
  </div>

</div>

<script>
async function runRLSTest() {
  const output = document.getElementById("output");

  function log(title, data) {
    output.textContent +=
      "\n\n" + title + "\n" +
      JSON.stringify(data, null, 2);
  }

  output.textContent = "MEMULAI PENGUJIAN...\n";

  const sb = window.tarbiyahSupabase;

  if (!sb || !window.TARBIYAH_BACKEND_READY) {
    log("KONEKSI SUPABASE", {
      success: false,
      message: "Supabase Client belum tersedia."
    });
    return;
  }

  const superAdminId =
    "efe7bc11-0f70-4abf-a30d-d02e2716a115";

  const { data: authData, error: authError } =
    await sb.auth.getUser();

  if (authError || !authData?.user) {
    log("STATUS LOGIN", {
      success: false,
      message: "Sesi login tidak ditemukan.",
      error: authError?.message
    });
    return;
  }

  const user = authData.user;

  log("STATUS LOGIN", {
    success: true,
    message: "Pengguna berhasil dikenali.",
    user_id: user.id
  });

  if (user.id === superAdminId) {
    log("PERINGATAN", {
      success: false,
      message: "Halaman ini harus dijalankan menggunakan akun Kang L."
    });
    return;
  }

  async function test(label, query, expectedRows) {
    try {
      const { data, error } = await query;

      const actualRows = data?.length ?? 0;

      log(label, {
        success: !error,
        expected_rows: expectedRows,
        actual_rows: actualRows,
        result_matches_expectation:
          !error && actualRows === expectedRows,
        data,
        error: error?.message ?? null
      });
    } catch (err) {
      log(label, {
        success: false,
        error: err.message
      });
    }
  }

  await test(
    "1. PROFIL MILIK SENDIRI",
    sb.from("profiles")
      .select("id, full_name, username")
      .eq("id", user.id),
    1
  );

  await test(
    "2. KEANGGOTAAN MILIK SENDIRI",
    sb.from("members")
      .select("user_id, membership_status")
      .eq("user_id", user.id),
    1
  );

  await test(
    "3. PROFIL SUPER ADMIN",
    sb.from("profiles")
      .select("id")
      .eq("id", superAdminId),
    0
  );

  await test(
    "4. KEANGGOTAAN SUPER ADMIN",
    sb.from("members")
      .select("user_id")
      .eq("user_id", superAdminId),
    0
  );

  await test(
    "5. DAFTAR ROLE",
    sb.from("roles")
      .select("name"),
    4
  );

  await test(
    "6. USER ROLE SUPER ADMIN",
    sb.from("user_roles")
      .select("user_id")
      .eq("user_id", superAdminId),
    0
  );

  log("PENGUJIAN SELESAI", {
    message: "Silakan periksa seluruh hasil pengujian."
  });
}


async function runWriteSecurityTest() {
  console.log("=== TARBIYAH SUPABASE DIAGNOSTIC ===");

console.log("Supabase CDN:", !!window.supabase);

console.log("TARBIYAH CONFIG:", !!window.TARBIYAH_CONFIG);

console.log("SUPABASE URL:",
  window.TARBIYAH_CONFIG?.SUPABASE_URL
);

console.log("SUPABASE CLIENT:",
  !!window.tarbiyahSupabase
);

console.log("BACKEND READY:",
  window.TARBIYAH_BACKEND_READY
);
  const output = document.getElementById("output");
  const sb = window.tarbiyahSupabase;

  output.textContent = "MEMULAI WRITE SECURITY TEST...\n";

  if (!sb || !window.TARBIYAH_BACKEND_READY) {
    output.textContent += "GAGAL: Supabase belum siap.";
    return;
  }

  const { data: authData, error: authError } =
    await sb.auth.getUser();

  if (authError || !authData?.user) {
    output.textContent += "GAGAL: Sesi login tidak ditemukan.";
    return;
  }

  const user = authData.user;

  const superAdminId =
    "efe7bc11-0f70-4abf-a30d-d02e2716a115";

  if (user.id === superAdminId) {
    output.textContent +=
      "DIBATALKAN: Gunakan akun Kang L.";
    return;
  }

  function log(title, result) {
    output.textContent +=
      "\n\n" + title + "\n" +
      JSON.stringify(result, null, 2);
  }

  async function testDenied(label, operation) {
    try {
      const { data, error } = await operation();

      log(label, {
        expected: "DITOLAK",
        actual: error
          ? "DITOLAK OLEH SUPABASE"
          : "TIDAK ADA ERROR",
        error: error?.message ?? null,
        returned_data: data,
        passed: !!error
      });

    } catch (err) {
      log(label, {
        expected: "DITOLAK",
        actual: "ERROR",
        error: err.message,
        passed: true
      });
    }
  }

  // 1. UPDATE membership dengan nilai yang sama.
  await testDenied(
    "1. UPDATE MEMBERSHIP SENDIRI",
    () => sb.from("members")
      .update({ membership_status: "pending" })
      .eq("user_id", user.id)
      .select("user_id, membership_status")
  );

  // 2. UPDATE user_roles dengan nilai user_id yang sama.
  await testDenied(
    "2. UPDATE ROLE SENDIRI",
    () => sb.from("user_roles")
      .update({ user_id: user.id })
      .eq("user_id", user.id)
      .select("user_id")
  );

  // 3. UPDATE roles dengan nama yang sama.
  await testDenied(
    "3. UPDATE DAFTAR ROLE SISTEM",
    () => sb.from("roles")
      .update({ name: "registered_user" })
      .eq("name", "registered_user")
      .select("name")
  );

  log(
    "4. RPC SET ADMIN ACCESS",
    {
      status: "BELUM DIUJI",
      reason: "Nama parameter RPC perlu diverifikasi dahulu."
    }
  );

  log("WRITE SECURITY TEST SELESAI", {
    user_id: user.id,
    message: "Periksa hasil masing-masing operasi."
  });
}


async function runRPCTest() {
  const output = document.getElementById("output");
  const sb = window.tarbiyahSupabase;

  output.textContent = "MEMULAI RPC AUTHORIZATION TEST...\n";

  if (!sb || !window.TARBIYAH_BACKEND_READY) {
    output.textContent += "GAGAL: Supabase belum siap.";
    return;
  }

  const { data: authData, error: authError } =
    await sb.auth.getUser();

  if (authError || !authData?.user) {
    output.textContent += "GAGAL: Sesi login tidak ditemukan.";
    return;
  }

  const user = authData.user;

  const superAdminId =
    "efe7bc11-0f70-4abf-a30d-d02e2716a115";

  if (user.id === superAdminId) {
    output.textContent +=
      "DIBATALKAN: Gunakan akun Kang L.";
    return;
  }

  function log(title, result) {
    output.textContent +=
      "\n\n" + title + "\n" +
      JSON.stringify(result, null, 2);
  }

  // Uji 1: Pengguna biasa mencoba menyetujui
  // keanggotaannya sendiri.
  try {
    const { data, error } = await sb.rpc(
      "review_member",
      {
        p_user_id: user.id,
        p_decision: "active",
        p_note: "Pengujian keamanan RPC"
      }
    );

    log("1. REVIEW_MEMBER - SELF APPROVAL", {
      expected: "DITOLAK",
      actual: error ? "DITOLAK" : "TIDAK ADA ERROR",
      error: error?.message ?? null,
      data,
      passed: !!error
    });
  } catch (err) {
    log("1. REVIEW_MEMBER - SELF APPROVAL", {
      expected: "DITOLAK",
      error: err.message
    });
  }

  // Uji 2: Pengguna biasa mencoba memberi
  // akses admin kepada dirinya sendiri.
  try {
    const { data, error } = await sb.rpc(
      "set_admin_access",
      {
        p_user_id: user.id,
        p_enabled: true
      }
    );

    log("2. SET_ADMIN_ACCESS - SELF PROMOTION", {
      expected: "DITOLAK",
      actual: error ? "DITOLAK" : "TIDAK ADA ERROR",
      error: error?.message ?? null,
      data,
      passed: !!error
    });
  } catch (err) {
    log("2. SET_ADMIN_ACCESS - SELF PROMOTION", {
      expected: "DITOLAK",
      error: err.message
    });
  }

  // Periksa ulang status membership dan role
  // setelah kedua percobaan.
  const { data: memberData, error: memberError } =
    await sb.from("members")
      .select("membership_status")
      .eq("user_id", user.id);

  const { data: roleData, error: roleError } =
    await sb.from("user_roles")
      .select("roles(name)")
      .eq("user_id", user.id);

  log("3. VERIFIKASI KONDISI SETELAH RPC", {
    membership: memberData,
    membership_error: memberError?.message ?? null,
    roles: roleData,
    role_error: roleError?.message ?? null
  });

  log("RPC AUTHORIZATION TEST SELESAI", {
    user_id: user.id,
    message: "Periksa pesan penolakan dan kondisi akhir."
  });
}

async function runApproveMemberTest() {
  const output = document.getElementById("output");
  const sb = window.tarbiyahSupabase;

  const superAdminId =
    "efe7bc11-0f70-4abf-a30d-d02e2716a115";

  const targetUserId =
    "e5ffb4a9-c66e-4ca0-81ae-3de81f215519";

  output.textContent =
    "MEMULAI PENGUJIAN PERSETUJUAN ANGGOTA...\n";

  if (!sb || !window.TARBIYAH_BACKEND_READY) {
    output.textContent +=
      "GAGAL: Supabase belum siap.";
    return;
  }

  const { data: authData, error: authError } =
    await sb.auth.getUser();

  if (authError || !authData?.user) {
    output.textContent +=
      "GAGAL: Sesi login tidak ditemukan.";
    return;
  }

  const currentUser = authData.user;

  if (currentUser.id !== superAdminId) {
    output.textContent +=
      "DITOLAK: Halaman ini harus dibuka menggunakan akun Super Admin.";
    return;
  }

  // Pastikan akun target masih pending.
  const { data: before, error: beforeError } =
    await sb.from("members")
      .select("membership_status")
      .eq("user_id", targetUserId)
      .maybeSingle();

  if (beforeError || !before) {
    output.textContent +=
      "GAGAL MEMERIKSA AKUN TARGET:\n" +
      (beforeError?.message || "Data anggota tidak ditemukan.");
    return;
  }

  if (before.membership_status !== "pending") {
    output.textContent +=
      "DIBATALKAN: Status target bukan pending. Status saat ini: " +
      before.membership_status;
    return;
  }

  output.textContent +=
    "\nAkun Super Admin terdeteksi." +
    "\nAkun target terverifikasi masih pending." +
    "\nMengirim permintaan persetujuan...\n";

  const { data, error } = await sb.rpc(
    "review_member",
    {
      p_user_id: targetUserId,
      p_decision: "active",
      p_note: "Persetujuan anggota melalui pengujian runtime TARBIYAH"
    }
  );

  output.textContent +=
    "\nHASIL RPC:\n" +
    JSON.stringify({
      expected: "BERHASIL",
      actual: error ? "GAGAL" : "BERHASIL",
      error: error?.message ?? null,
      data
    }, null, 2);

  if (error) return;

  // Verifikasi kondisi akhir database.
  const { data: member, error: memberError } =
    await sb.from("members")
      .select("membership_status")
      .eq("user_id", targetUserId)
      .maybeSingle();

  const { data: roles, error: rolesError } =
    await sb.from("user_roles")
      .select("roles(name)")
      .eq("user_id", targetUserId);

  output.textContent +=
    "\n\nVERIFIKASI AKHIR:\n" +
    JSON.stringify({
      membership: member,
      membership_error: memberError?.message ?? null,
      roles: roles,
      roles_error: rolesError?.message ?? null,
      expected_membership: "active",
      expected_role: "member"
    }, null, 2);
}
  
</script>
</body>
</html>
