<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102a22">
  <meta name="description" content="Catatan Pembinaan Anggota TARBIYAH">
  <title>Pembinaan — TARBIYAH</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Utama TARBIYAH -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/brand-logo.css">
  <link rel="stylesheet" href="./css/module.css">
  <link rel="stylesheet" href="./css/module-shell.css">
  
  <!-- CSS Navigasi Tombol Back Universal -->
  <link rel="stylesheet" href="./css/page-navigation.css">

  <style>
    /* =========================================
       HEADER & UI (STANDAR UNIVERSAL TARBIYAH)
    ========================================= */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      height: 70px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* KUNCI LOGO AGAR TIDAK PECAH */
    .brand-logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border-radius: 10px;
      overflow: hidden;
    }

    .brand-logo-wrap .brand-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .header-brand-text h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: .05em;
      color: var(--color-primary, #36b58a);
      line-height: 1.1;
      font-family: var(--font-heading);
    }

    .header-brand-text span {
      display: block;
      font-size: .75rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* TOMBOL IKON (TOGGLE TEMA TERKUNCI) */
    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 1.25rem;
      text-decoration: none;
      transition: all .2s ease;
    }

    .icon-button:hover {
      border-color: var(--color-primary);
      background: var(--bg-tertiary);
    }

    /* =========================================
       LAYOUT UTAMA
    ========================================= */
    .app-main {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Jarak aman untuk tombol back */
    .page-header-nav {
      margin-bottom: 30px;
    }

    /* =========================================
       KONTEN PEMBINAAN (MENGGUNAKAN VARIABEL TEMA)
    ========================================= */
    .guidance-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .guidance-top h2 {
      margin: 0;
      font: 800 clamp(24px, 4vw, 32px) var(--font-heading);
      color: var(--text-primary);
    }

    .guidance-top p {
      margin: 7px 0 0;
      color: var(--text-secondary);
      font-size: .9rem;
      line-height: 1.6;
    }

    .guidance-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
      margin-bottom: 22px;
    }

    .guidance-stat {
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      background: var(--bg-secondary);
    }

    .guidance-stat small {
      display: block;
      color: var(--text-secondary);
      font-size: .75rem;
      margin-bottom: 5px;
    }

    .guidance-stat strong {
      display: block;
      font: 800 1.7rem var(--font-heading);
      color: var(--color-primary);
    }

    .guidance-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, .85fr);
      gap: 18px;
      align-items: start;
    }

    .guidance-card {
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 20px;
      background: var(--bg-secondary);
    }

    .guidance-card h3 {
      margin: 0 0 16px;
      font: 700 1.1rem var(--font-heading);
      color: var(--text-primary);
    }

    .guidance-field {
      display: block;
      margin: 0 0 14px;
    }

    .guidance-field span {
      display: block;
      margin-bottom: 7px;
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .guidance-field input,
    .guidance-field select,
    .guidance-field textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 13px;
      border: 1px solid var(--border-color);
      border-radius: 11px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font: inherit;
      font-size: .85rem;
      outline: none;
    }

    .guidance-field textarea {
      min-height: 120px;
      resize: vertical;
    }

    .guidance-field input:focus,
    .guidance-field select:focus,
    .guidance-field textarea:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(54,181,138,.15);
    }

    /* Perbaikan Dropdown Option di Light/Dark Mode */
    .guidance-field select option {
      color: var(--text-primary);
      background: var(--bg-secondary);
    }

    .guidance-btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: inherit;
      font-size: .85rem;
      transition: all .2s ease;
    }

    .guidance-primary {
      background: #047857;
      color: white;
    }
    .guidance-primary:hover {
      background: #059669;
    }

    .guidance-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    .guidance-secondary:hover {
      background: var(--bg-primary);
    }

    .guidance-list {
      display: grid;
      gap: 12px;
    }

    .guidance-item {
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 15px;
      background: var(--bg-primary);
    }

    .guidance-item h4 {
      margin: 0 0 7px;
      font-size: .95rem;
      color: var(--text-primary);
    }

    .guidance-item p {
      white-space: pre-wrap;
      line-height: 1.55;
      margin: 8px 0;
      color: var(--text-secondary);
      font-size: .85rem;
    }

    .guidance-meta {
      font-size: .75rem;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .guidance-item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .guidance-empty {
      text-align: center;
      color: var(--text-secondary);
      padding: 24px 10px;
      font-size: .85rem;
    }

    .guidance-message {
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      display: none;
      font-size: .85rem;
    }
    .guidance-message.show { display: block; }
    .guidance-message.error {
      background: rgba(239,68,68,.1);
      color: #f87171;
    }
    .guidance-message.success {
      background: rgba(54,181,138,.1);
      color: var(--color-primary);
    }

    .guidance-status {
      display: inline-block;
      border-radius: 30px;
      padding: 5px 10px;
      font-size: .7rem;
      font-weight: 700;
      background: rgba(54,181,138,.12);
      color: var(--color-primary);
    }
    .guidance-status.done { background: rgba(54,181,138,.2); }
    .guidance-status.pending { background: rgba(245,158,11,.15); color: #fbbf24; }

    @media(max-width: 760px) {
      .guidance-grid { grid-template-columns: 1fr; }
    }
    @media(max-width: 640px) {
      .app-main { padding: 16px; }
      .guidance-stats { gap: 9px; }
      .guidance-stat { padding: 12px; }
      .guidance-stat strong { font-size: 1.3rem; }
      .guidance-card { padding: 15px; }
      .guidance-btn { width: 100%; }
    }
    @media(max-width: 420px) {
      .guidance-stats { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body class="auth-pending">

  <div class="app-shell">

    <!-- =========================================
         HEADER UNIVERSAL
    ========================================== -->
    <header class="app-header">
      <div class="header-left">
        <div class="header-brand">
          <div class="brand-logo-wrap">
            <img src="./assets/icons/icon-192.png" class="brand-logo" alt="Logo TARBIYAH">
          </div>
          <div class="header-brand-text">
            <h1>TARBIYAH</h1>
            <span>Catatan Pembinaan</span>
          </div>
        </div>
      </div>

      <div class="header-right">
        <button type="button" id="btnTheme" class="icon-button" aria-label="Ubah tema">
          ☀
        </button>
        <a href="./notifikasi.html" class="icon-button" aria-label="Notifikasi">
          ♧
        </a>
      </div>
    </header>

    <!-- =========================================
         MAIN CONTENT
    ========================================== -->
    <main class="app-main">

      <!-- 1. TOMBOL BACK UNIVERSAL -->
      <div class="page-header-nav">
        <a href="./dashboard.html" class="tarbiyah-page-nav__button" aria-label="Kembali ke Dashboard">
          <span class="tarbiyah-page-nav__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </span>
          <span class="tarbiyah-page-nav__label">Kembali ke Dashboard</span>
        </a>
      </div>

      <!-- 2. HEADER HALAMAN -->
      <header class="guidance-top">
        <div>
          <h2>✎ Pembinaan</h2>
          <p>Catatan perkembangan dan tindak lanjut anggota binaan.</p>
        </div>
      </header>

      <div id="guidanceMessage" class="guidance-message" role="status"></div>

      <!-- 3. STATISTIK -->
      <section class="guidance-stats">
        <div class="guidance-stat">
          <small>Anggota Binaan</small>
          <strong id="statMembers">0</strong>
        </div>
        <div class="guidance-stat">
          <small>Total Catatan</small>
          <strong id="statNotes">0</strong>
        </div>
        <div class="guidance-stat">
          <small>Dalam Proses</small>
          <strong id="statProgress">0</strong>
        </div>
      </section>

      <!-- 4. KONTEN UTAMA -->
      <div class="guidance-grid">
        <section class="guidance-card">
          <h3 id="formHeading">Tambah Catatan Pembinaan</h3>

          <form id="guidanceForm">
            <input type="hidden" id="noteId">

            <label class="guidance-field">
              <span>Anggota Binaan</span>
              <select id="memberSelect" required>
                <option value="">Memuat anggota binaan...</option>
              </select>
            </label>

            <label class="guidance-field">
              <span>Judul Pembinaan</span>
              <input id="noteTitle" type="text" maxlength="150" placeholder="Contoh: Perkembangan pembelajaran pekan ini" required>
            </label>

            <label class="guidance-field">
              <span>Catatan Pembinaan</span>
              <textarea id="noteContent" maxlength="10000" placeholder="Tuliskan hasil pembinaan, perkembangan, arahan, atau hal yang perlu diperhatikan..." required></textarea>
            </label>

            <label class="guidance-field">
              <span>Status Perkembangan</span>
              <select id="progressStatus" required>
                <option value="belum_dimulai">Belum dimulai</option>
                <option value="berjalan" selected>Berjalan</option>
                <option value="selesai">Selesai</option>
              </select>
            </label>

            <label class="guidance-field">
              <span>Jadwal Tindak Lanjut (opsional)</span>
              <input id="followUpAt" type="datetime-local">
            </label>

            <div style="display:flex;gap:9px;flex-wrap:wrap; margin-top:20px;">
              <button class="guidance-btn guidance-primary" id="saveNoteBtn" type="submit">
                Simpan Catatan
              </button>
              <button class="guidance-btn guidance-secondary" id="cancelEditBtn" type="button" hidden>
                Batal Edit
              </button>
            </div>
          </form>
        </section>

        <section class="guidance-card">
          <h3>Riwayat Pembinaan</h3>
          <div class="guidance-list" id="guidanceList">
            <div class="guidance-empty">Memuat catatan pembinaan...</div>
          </div>
        </section>
      </div>

    </main>
  </div>

  <!-- SUPABASE & SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/auth-guard.js"></script>
  
  <!-- SCRIPT TEMA -->
  <script src="./js/tarbiyah-theme.js"></script>
  
  <script src="./js/pwa.js"></script>
  
  <!-- LOGIC JS PEMBINAAN -->
  <script src="./js/pembinaan.js"></script>
</body>
</html>
